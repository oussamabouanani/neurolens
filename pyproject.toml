[project]
name = "neurolens"
version = "0.0.1"
description = "A package for labeling neurons in vision models with human-understandable concepts."
readme = "README.md"
authors = [
    { name = "Oussama Bouanani", email = "oussama.bouanani.dev@tuta.com" },
]
keywords = [
    "mechanistic interpretability",
    "vision models",
    "neuron labeling",
    "deep learning",
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "jaxtyping>=0.3.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "torch>=2.11.0",
    "diffusers>=0.32.2",
    "transformers>=4.49.0",
    "tqdm>=4.67.3",
    "zarr>=3.1.6",
]

[dependency-groups]
dev = [
    "open-clip-torch>=3.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "torchvision>=0.27.0",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["F722"]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["neurolens"]
combine-as-imports = true
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurolens"]